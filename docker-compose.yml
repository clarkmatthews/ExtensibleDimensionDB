# One-command local or single-server deployment:
#   cp .env.example .env    # set AUTH_SECRET (and ADMIN_PASSWORD for the first start)
#   docker compose up -d
# Then open http://localhost:3000 and sign in as admin@local.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: dimensionUser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dimensionUser123!}
      POSTGRES_DB: dimensionInfo
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dimensionUser -d dimensionInfo"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      # Prisma sizes its pool from the CPU count, which is only 3 connections on a one-CPU server.
      DATABASE_URL: postgresql://dimensionUser:${POSTGRES_PASSWORD_URLENCODED:-dimensionUser123%21}@db:5432/dimensionInfo?connection_limit=10
    ports:
      - "3000:3000"

volumes:
  db-data:
