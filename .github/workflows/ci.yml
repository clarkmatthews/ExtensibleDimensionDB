name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://dimensionUser:ci-password@localhost:5432/dimensionInfo
      AUTH_SECRET: ci-only-secret-that-is-long-enough-0123456789
      ADMIN_PASSWORD: Ci-Only-Admin-Pass-2026!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The runner image ships PostgreSQL. Starting it avoids pulling an image from Docker Hub,
      # which has failed intermittently on GitHub-hosted runners.
      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE ROLE \"dimensionUser\" LOGIN PASSWORD 'ci-password'"
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE \"dimensionInfo\" OWNER \"dimensionUser\""
      - run: npm ci
      - name: Apply every migration to an empty database
        run: npx prisma migrate deploy
      - name: Seed, then seed again to confirm it is safe to repeat
        run: npm run db:seed && npm run db:seed
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx next build
